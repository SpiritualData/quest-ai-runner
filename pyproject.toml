[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-ai-runner"
version = "0.1.0"
description = "The orchestrator brain (importable core) plus the queued-task executor (runner) for Quest AI tasks. Generic, no consumer-specific logic."
readme = "README.md"
requires-python = ">=3.11"  # tomllib (RunnerConfig.from_file) is 3.11+
license = { text = "Apache-2.0" }
authors = [{ name = "Spiritual Data", email = "opensource@spiritualdata.org" }]
keywords = ["quest", "orchestrator", "agent", "task-runner", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# The CORE brain + the RUNNER are stdlib-only (urllib for the Quest client) except for tzdata.
# TUI dependencies are core: Textual is the ONLY chat UI, with no fallback renderer.
# Model providers (anthropic, gemini) and vector stores (qdrant, bm25) remain optional.
dependencies = [
    "rich>=13.0",
    "textual>=0.40.0",
    "PyYAML>=6.0",
    # A small, pure-data wheel providing the IANA tz database to `zoneinfo` (runner/local_time.py)
    # on hosts whose OS has none (minimal containers, Windows). `zoneinfo` itself is stdlib
    # (3.9+); this only supplies the DATA it reads. Per-quest run_timezone degrades gracefully to
    # the runner's local clock when a zone can't be resolved either way (see local_time.py), so a
    # missing database is a warning, never a crash.
    "tzdata>=2024.1",
    # Reads PDF links a user pastes (hubofhubs.websearch.link_access.extract_pdf_text). Core, not an extra:
    # a deployed image installs only the core list, and without it every PDF link fails.
    "pypdf>=4.0",
    # Word and Excel text for attachments and for `serve-files` reads (core/attachments.py loads
    # each lazily and falls back to a binary note when absent). Core, like pypdf: a deployed
    # image installs only this list.
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # Declares each swappable implementation beside its code (`@implementation`) and selects one at run time
    # (core/resolve.py). Core, since the adapters import it; no dependencies of its own. Tracks esoi main like the
    # backend and conceptai do: two different direct-URL commits of one package cannot be installed together.
    "esoi @ git+https://github.com/JoshuaMathias/evolvable-structure.git@main#subdirectory=implementations/python",
    # The hub of hubs: the registry of AI-intelligence hubs, the seats (Protocols) and the assembly that wires them. QAR is
    # Quest's connector and the production consumer: quest_ai_runner/hub.py imports it at startup and registers QAR's parts.
    # Required, not an extra. Its own dependency is `esoi` (bare), met by the esoi line above. Dev and tests may use the
    # sibling checkout `../ai-hub-of-hubs-structure` on the path (pytest `pythonpath` below) instead of installing it.
    "hubofhubs[locks] @ git+https://github.com/SpiritualData/ai-hub-of-hubs-structure.git@main",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=2.0"]
qdrant = ["qdrant-client>=1.7", "fastembed>=0.3"]
bm25 = ["bm25s>=0.2"]
# AcpDeepRunner: the opt-in DeepRunner that drives Claude over the Agent Client Protocol instead
# of a one-shot `claude -p` subprocess (see docs/acp-deep-runner.md). The default deep runner needs
# none of this. The Python side is this package; the agent side is the separate Node program
# `@agentclientprotocol/claude-agent-acp` (npm, requires Node >= 22), which pip cannot install.
acp = ["agent-client-protocol>=0.12"]
# MCPClient / MCPRetrievalAdapter: a generic MCP (Model Context Protocol) client (stdio subprocess
# or streamable HTTP transport). Pinned to 2.0.0 exactly -- the version this module was built and
# tested against (the current PyPI release as of Aug 2026, reflecting the protocol's July 2026
# revision); see the version comment at the top of adapters/mcp_client.py. The adapter itself
# imports this lazily inside its own connection seam, so importing quest_ai_runner.adapters never
# requires it -- install this extra only when a consumer actually wires an MCP server.
mcp = ["mcp==2.0.0"]
# GoogleChatAdapter's service_account_token_provider (domain-wide delegation for a Google
# Workspace). The adapter itself is stdlib-only; only this token provider needs google-auth.
google = ["google-auth>=2.0", "requests>=2.28"]
# GoogleDriveAdapter's PDF text extraction (files.get(alt="media") -> pypdf). The adapter itself
# is stdlib-only except for this lazy import, used only when a PDF is actually read; Docs/Sheets/
# plain-text reads need no extra dependency. Pair with [google] for the service-account token
# provider if reading a Google Workspace's Drive.
drive = ["pypdf>=4.0"]
# All production providers (the TUI is core, not optional)
all = [
    "anthropic>=0.40",
    "google-genai>=2.0",
    "google-auth>=2.0",
    "pypdf>=4.0",
    "qdrant-client>=1.7",
    "fastembed>=0.3",
    "bm25s>=0.2",
    "mcp==2.0.0",
]
# esoi (a core dependency, pinned above) also checks esoi/ and runs and records the evaluation components
# (`esoi check`, `esoi run`, `esoi hygiene`), so dev and test need nothing more of it.
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/SpiritualData/quest-ai-runner"
Repository = "https://github.com/SpiritualData/quest-ai-runner"
Issues = "https://github.com/SpiritualData/quest-ai-runner/issues"
Changelog = "https://github.com/SpiritualData/quest-ai-runner/blob/main/CHANGELOG.md"

[project.scripts]
quest-ai-runner = "quest_ai_runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quest_ai_runner*"]

[tool.setuptools.package-data]
quest_ai_runner = ["prompts/*.md", "esoi_selection.json", "core/quest_field_guidance.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation/components"]
# The sibling checkout of the hub (a required dependency) when it is not pip-installed: dev and tests import it from here.
pythonpath = ["../ai-hub-of-hubs-structure"]
# Async TUI tests (textual's run_test harness) are marked @pytest.mark.asyncio explicitly,
# so keep strict mode — only marked coroutines run on the event loop.
asyncio_mode = "strict"
