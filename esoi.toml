# esoi configuration for quest-ai-runner (one adopter's setup; copy it to the repository root as esoi.toml).
package = "quest_ai_runner"
layers = ["core", "adapters", "runner", "config", ["cli", "tools"]]
other_layers = ["prompts", "docs", "evaluation", "examples", "scripts", "tests", "vendor"]
max_lines = 1500
# Where the maintainers keep the skill that defines the intent template; absent elsewhere, then S27 is skipped
# and the committed esoi/esoi_template.csv is what records are checked against.
template_source = "../../.claude/skills/evolvable-structure/SKILL.md"
# live_calls: evaluation implementations that drive the real orchestrator through the shared offline builder
live_calls = ["common.build_offline_orchestrator", "hygiene.scan_text"]
plugins = ["scripts/esoi_rules.py"]
# measured code for staleness: the package and the evaluation drivers, not their prose
code_paths = ["quest_ai_runner", "evaluation/components", ":(exclude,glob)**/*.md"]


[tracker_extra]
solutions = ["tags"]

# The specification's owner approved one column beyond the template: a solution's tags (ids from esoi/tags.csv,
# checked by rule Q1 in scripts/esoi_rules.py).
[records.approved_fields]
solutions = ["tags"]

[rules.S13]
paths = ["quest_ai_runner/core/"]
hint = 'take the value from RunnerConfig (or add a waiver "migrate into RunnerConfig")'

[hermetic]
prefixes = ["QAR_"]
names = ["QAR_WEB_SEARCH_BACKEND", "SERPER_API_KEY", "BRAVE_SEARCH_API_KEY", "BRAVE_API_KEY", "TAVILY_API_KEY",
         "WEB_SEARCH_API_KEY", "SEARXNG_URL", "GEMINI_API_KEY", "GOOGLE_API_KEY", "GOOGLE_AI_API_KEY",
         "QUEST_BASE_URL", "QUEST_API_URL", "QUEST_API_KEY", "QUEST_TEAM_ID", "QUEST_TEAM_IDS", "QUEST_ORG_ID",
         "CLAUDE_CONFIG_DIR"]
set = { QAR_STANDARD_TOOLS = "0", QAR_CLAUDE_PATH = "qar-eval-no-such-claude", QAR_CLAUDE_LIVE_MODELS = "0" }

# The balanced score of the spec-selection metric (esoi/balance.py): accuracy 70%, cost 15%, time 15%. A request is worth
# at most half a cent and ten seconds; an arm that spends the whole of either gets zero for it.
[balance.spec_selection]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.005
seconds_per_case = 10
