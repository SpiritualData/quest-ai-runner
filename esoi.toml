# esoi configuration for quest-ai-runner (one adopter's setup; copy it to the repository root as esoi.toml).
package = "quest_ai_runner"
# An area folder (quest_ai_runner/<intent id>/, listed here once it holds code) sits above core and adapters, at the rank of runner: core and
# adapters never import an area folder, so the brain stays free of Quest; an area folder's modules import core, adapters and runner, and are
# imported by the runner and the configuration. A file in an area folder is checked as that area, whatever layer its component row names.
layers = ["core", "adapters", ["runner", "keep_it_generic", "know_the_world", "watch_for_risk", "take_in_the_world", "think_critically", "select_context", "act_as_the_body", "hold_the_intents", "remember_and_recall"], "config", ["cli", "tools"]]
other_layers = ["prompts", "docs", "evaluation", "examples", "scripts", "tests"]
max_lines = 1500
# Where the maintainers keep the skill that defines the intent template; absent elsewhere, then S27 is skipped
# and the committed esoi/esoi_template.csv is what records are checked against.
template_source = "../../.claude/skills/evolvable-structure/SKILL.md"
# live_calls: evaluation implementations that drive the real orchestrator through the shared offline builder
live_calls = ["common.build_offline_orchestrator", "scripted_brain.build_brain", "hygiene.scan_text"]
plugins = ["scripts/esoi_rules.py"]
# measured code for staleness: the package and the evaluation drivers, not their prose
# The records beside the code (see [records] beside_code) are not measured code either: editing one does not make a recorded result stale.
code_paths = ["quest_ai_runner", "evaluation/components", ":(exclude,glob)**/*.md",
              # pytest modules check the arms and are imported by none of them: editing one cannot change what a recorded result measured
              ":(exclude,glob)evaluation/components/**/test_*.py", ":(exclude,glob)evaluation/components/conftest.py", ":(exclude,glob)quest_ai_runner/**/intent.csv",
              ":(exclude,glob)quest_ai_runner/**/problems.csv", ":(exclude,glob)quest_ai_runner/**/ideals.csv",
              ":(exclude,glob)quest_ai_runner/**/solutions.csv", ":(exclude,glob)quest_ai_runner/**/implementations.csv",
              ":(exclude,glob)quest_ai_runner/**/metrics.csv"]
# Estimated list price in dollars per million tokens of the cheapest tier a live arm pins,, so a run that reports tokens and no
# dollars is still priced.
prices = { "claude-haiku-5-5" = { input = 0.10, output = 0.50 }, "claude-code-subscription" = { input = 0.0, output = 0.0 } }


[rules.S13]
paths = ["quest_ai_runner/core/"]
hint = 'take the value from RunnerConfig (or add a waiver "migrate into RunnerConfig")'

[hermetic]
prefixes = ["QAR_"]
names = ["QAR_WEB_SEARCH_BACKEND", "SERPER_API_KEY", "BRAVE_SEARCH_API_KEY", "BRAVE_API_KEY", "TAVILY_API_KEY",
         "WEB_SEARCH_API_KEY", "SEARXNG_URL", "GEMINI_API_KEY", "GOOGLE_API_KEY", "GOOGLE_AI_API_KEY",
         "QUEST_BASE_URL", "QUEST_API_URL", "QUEST_API_KEY", "QUEST_TEAM_ID", "QUEST_TEAM_IDS", "QUEST_ORG_ID",
         "CLAUDE_CONFIG_DIR"]
set = { QAR_STANDARD_TOOLS = "0", QAR_CLAUDE_PATH = "qar-eval-no-such-claude", QAR_CLAUDE_LIVE_MODELS = "0" }

# The context-selection score (metric-select-context): ONE number per arm, from the hub's retrieval cases (its foundation, see [builds_on] below) and QAR's private real requests. Accuracy 70%, cost 15%, time 15%, set by value before any arm of the hub was scored. Cost is the arm's model dollars plus
# its store charge (evaluation/components/context_selection/store_cost.py): a store as large as the card limit (1,000 cards) pays the whole
# per-case budget, so how many cards an arm needs is weighed in the same number. A case is worth at most two cents (a fifth of a small edit) and
# twelve seconds, the budgets the hub's card-builder components use.
[balance.context_selection]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.02
seconds_per_case = 12

# Reading the Quest server is a cost and a risk of its own (esoi/access.py): each private case reads its candidate items from the server, metered by
# the arm's meter, priced at these constants and bounded per request. A request that reads more than 200 records, outside the Quest scope or scans a
# whole source fails. The constants are committed before any arm is scored with them (rule S44 reads this file's history).
[balance.context_selection.source_access]
usd_per_record = 0.00001
usd_per_mb = 0.01
usd_per_call = 0.0001
max_records_per_request = 200
allowed_scopes = ["quest"]
forbid_full_scan = true

# metric-select-context BUILDS ON the hub's metrics (esoi/foundation.py): it measures on them without re-running them and keeps no copy of their
# cases or scorers. The shares are the shares of the one number; the private real requests (Quest server and local files, QAR's own) carry the rest.
# `retrieval` is the hub's context_retrieval metric (file, topic, orientation and no-context kinds): an arm named hub_<x> is the hub's arm <x> and
# reuses the hub's recorded per-case results when they are current; any other arm is run through the hub's own scorer by
# evaluation/components/context_selection/foundation_adapter.py. `bootstrap` is the hub's cards_from_files metric (building a store from source files is
# its own solution, shared by every selector); a selector that keeps cards from a hub card builder names it with FOUNDATION_ARMS, and the shares renormalise
# over the parts an arm has. The 0.50 / 0.17 / 0.33 split keeps the third the real inputs carried when the three sources were equal.
[builds_on.context_selection.retrieval]
repo = "../ai-hub-of-hubs-structure"
component = "context_retrieval"
share = 0.50
arm_prefix = "hub_"

[builds_on.context_selection.bootstrap]
repo = "../ai-hub-of-hubs-structure"
component = "cards_from_files"
share = 0.17

# The balanced score of the spec-selection metric (esoi/balance.py): accuracy 70%, cost 15%, time 15%. A request is worth
# at most half a cent and ten seconds; an arm that spends the whole of either gets zero for it.
[balance.spec_selection]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.005
seconds_per_case = 10

# The terminal helper calls (metric-assist-a-terminal-session): a command is worth at most a tenth of a cent and two seconds, the wait a
# person at a prompt does not notice; an arm that spends the whole of either gets zero for it, so a model call has to buy its price in accuracy.
[balance.assist_a_terminal_session]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 2

# The whole-path check (metric-answer-end-to-end): a turn goes through the real orchestrator on the Claude Code subscription, so its
# dollar price is declared as zero; a person waits about a minute for a chat reply that reads, acts and answers, so a turn is worth
# a minute.
[balance.end_to_end]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.05
seconds_per_case = 60

# The task replay (metric-iterate-by-spec): a replayed task goes through a real deep run on the Claude Code subscription, so it costs no API
# dollars (its price is declared as zero); the wait a person gives a delegated task is minutes, so a task is worth three minutes.
[balance.task_replay]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.05
seconds_per_case = 180

# The three model calls with no reply-path budget of their own (metric-narrate-a-turn, metric-explain-an-answer, metric-describe-an-attachment).
# Their metric records bound the cost by "the cost of the answer it precedes or informs"; the figure used is the 2026-10-23 spend audit's
# average production request, $67 over 1,534 requests, about $0.044. The first beat is joined by the turn for at most 5 seconds (Narrator.flush_first).
# The explanation is written after the answer is out and the description is awaited before the answer; no record states the wait a person gives
# either, so 10 seconds is a declared assumption pending a decision, not a measured figure.
[balance.narrate_a_turn]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.044
seconds_per_case = 5

[balance.explain_an_answer]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.044
seconds_per_case = 10

[balance.describe_an_attachment]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.044
seconds_per_case = 10

# The combined QAR metric (metric-qar-overall, the authoritative metric of do-grounded-work; evaluation/components/qar_overall). Keyed by
# the metric id, not a component name, because the harness reads [balance.<component>] as an accuracy/cost/time balance.
# Each of do-grounded-work's ideals carries a weight (summing to 1), split equally over the sub-metrics QME1 to QME8 whose ideal_ids name
# it (the metrics.csv records of the tree). Joshua can change any weight; the reason beside it says why it is what it is now.
[balance.metric-qar-overall]
ideals = { QI1 = 0.25, QI2 = 0.25, QI3 = 0.15, QI4 = 0.10, QI5 = 0.10, QI6 = 0.15 }
bar = 0.8                         # a sub-metric "passes" its case at or above this value on current rows
cost_per_passing_turn_usd = 0.05  # QME1: "a few cents" per passing turn (answer-a-turn milestone); dearer turns scale down

[balance.metric-qar-overall.reasons]
QI1 = "The top intent's first clause: goals keep moving because delegated work gets done to the standard written. The reason QAR exists."
QI2 = "The top intent's second clause: every answer rests on the person's own material, never another's. Wrong or leaked help is worse than none."
QI3 = "Acting first without taking a human-only step decides whether people can delegate at all; weighted below the two clauses of the vision."
QI4 = "One engine for every consumer is how QAR stays worth maintaining, but it serves the person only indirectly."
QI5 = "Selection by metric is the method that keeps the other ideals improving; it is a means, so it carries less than the outcomes it protects."
QI6 = "Cost and quality known before they surprise anyone: spend is a real constraint (a daily cap), so it weighs as much as consent."

# QAR builds on the hub of hubs: the hub's ESOI-informed defaults sit beneath QAR's own `selected` arms, and a solution whose
# `selected` differs from the hub's default cites ids of QAR's own records in esoi/overrides.csv (rule S35).
[parent]
records = "../ai-hub-of-hubs-structure"

[records]
template_version = 4
# Each solution's records live once, in the folder that holds its code (docs/reference/records-beside-code.md in the esoi repository).
# The top intent stays in esoi/; each area of QAR is a sub-intent folder of quest_ai_runner/, named by its intent id.
beside_code = ["quest_ai_runner", "quest_ai_runner/*", "evaluation/components/*", "evaluation/components/*/impls"]
# Folders that hold the code of an arm (or a check) whose record belongs to an intent elsewhere: each gets a generated README, no records move.
arm_folders = ["evaluation/components/*/broken", "evaluation/components/classification", "tests", "scripts", "quest_ai_runner/tools"]

# Public evidence: others' measurements, shown beside our own results and never counted as one. The file is the hub's derived
# export of its registry (the hub keeps the source of truth); aliases map a candidate to the QAR arm it measures, only where the
# match is honest. for Payal to confirm.
[evidence]
file = "../ai-hub-of-hubs-structure/esoi/evidence.csv"

[evidence.aliases]
"bm25s" = "bm25"
"bge-small-en-v1.5" = "vector_bge_small"
"Claude Code CLI (claude -p stream-json)" = "stream_json"

# Opt-in rules: S36 network, S37 entry, S38 coherence, S39 ratchet.
# A floor is a measurement: each one below is the value `python3 -m esoi.coherence` reports for that intent now, with the reason beside it.
# Earlier floors of 1.0 (and select_context 0.667) had been set on docstring sentences that named the ids; E2 counts executable code only,
# so those were above what the code shows and are lowered here. A floor rises when a composition is typed in code, and is never set above a measurement.
[rules.S36]
enabled = true

[rules.S37]
enabled = true

[rules.S38]
enabled = true
# The limit on how many solutions one implementation uses is raised from 9 to 12, for one reason: the top intent's one implementation,
# do-grounded-work:library, takes the model, the Quest account and nine areas as typed seats (goal_agent.py), and the code composes no
# grouping of them (the areas are siblings, none builds on another), so grouping them in the records would state a layer the code does
# not have. No other intent uses more than three. The esoi library reads max_fan_out as one value for the repository (there is no per-intent
# key in `[rules.S38.floors.<intent>]`), so the limit is this one value, to be lowered with the library change that allows it per intent.
# The sentence limit (which defaults to the fan-out limit plus one) is pinned at its old value.
max_fan_out = 12
max_names_per_sentence = 10

# The top intent: every edge between its solutions is imported code or executable names.
[rules.S38.floors.quest-ai-runner]
precision = 1.0
coverage = 1.0

# The floors of each area (a sub-intent): the measured precision and coverage of its edges, host edges included (the area's implementation
# uses every root of the area). Edges that show no code are named by `python3 -m esoi.coherence`.
# 5 of 7: run-deep-work and write-through-mcp are parts of the area that the area's composition does not type.
[rules.S38.floors.act_as_the_body]
precision = 0.714
coverage = 1.0

[rules.S38.floors.hold_the_intents]
precision = 1.0
coverage = 1.0

# No checkable edge: none of the five solutions has a module in the package (their code is the esoi library's records and checks, the
# files under evaluation/ and the tests), so the area's edges to its host have no code to show and coverage is 0.0. The selector
# (select-an-implementation) was moved to take_in_the_world, where configure-a-lane imports it, after its edge here named no code.
[rules.S38.floors.keep_it_generic]
precision = 0.0
coverage = 0.0

[rules.S38.floors.know_the_world]
precision = 1.0
coverage = 1.0

# 11 of 11: narrate-a-turn and explain-an-answer are used by answer-end-to-end, whose orchestrator imports both, so they are recorded
# under it and are no longer roots; show-progress is shown by the component that owns its module (the library's E4 evidence).
[rules.S38.floors.reason_and_answer]
precision = 1.0
coverage = 1.0

# 2 of 6: card-store imports persist-cards and persist-cards takes the cache-cards seat. The recency window takes only the card store
# (a hub seat), so its edges to label-context-cards, repair-a-card-store, cards-from-files, detect-stale-cards and bound-card-growth show no
# code: those five solutions use no other solution in code and are listed as the window's roots only because the hierarchy rule asks the
# host to use every root. Coverage 0.667: detect-stale-cards, bound-card-growth and choose-what-to-index have no module in the package.
[rules.S38.floors.remember_and_recall]
precision = 0.333
coverage = 0.667

# 4 of 4: the area arises from choose-the-context:per_lane_assembly (select_context/area.py), which takes the assembler, the reference
# resolver, the meaning index and names the mixed search in code, so every host edge shows imported code or an executable name.
[rules.S38.floors.select_context]
precision = 1.0
coverage = 1.0

# 7 of 8: feed-context-sources is a part of the area that no typed seat composes; configure-a-lane imports the selector it uses
# (select-an-implementation, moved here from keep_it_generic); coverage 0.667: four edges have an end with no module.
[rules.S38.floors.take_in_the_world]
precision = 0.875
coverage = 0.667

# 7 of 8: spec-selection is a part of the area that no typed seat composes.
[rules.S38.floors.think_critically]
precision = 0.875
coverage = 1.0

[rules.S38.floors.watch_for_risk]
precision = 1.0
coverage = 1.0

[rules.S39]
enabled = true
