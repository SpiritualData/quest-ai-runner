# One connection to ONE integration aggregator, instead of one adapter per app (docs/hub-of-hubs.md).
#
# An aggregator such as Activepieces (MIT community edition, self-hostable) exposes the apps it supports as MCP tools, so the lane
# gains every app the aggregator has by pointing at it. No per-app entry belongs here: adding Notion, Drive or chat is done inside
# the aggregator, not in this file. The URL below is a placeholder; the bearer token stays in the environment (token_env names the
# variable) and never in this file. Merge this table into the lane's own config file; it carries no other setting.

[[mcp_servers]]
alias = "world-hub"
transport = "http"
url = "https://your-aggregator.invalid/mcp"
token_env = "WORLD_HUB_TOKEN"
